name: Reusable TWRP build

on:
  workflow_call:
    inputs:
      manifest_url:
        required: true
        type: string
      manifest_branch:
        required: true
        type: string
      device_tree_url:
        required: false
        type: string
        default: https://github.com/LuoJuly/twrp_android_device_motorola_xpeng
      device_tree_ref:
        required: true
        type: string
      device_path:
        required: false
        type: string
        default: device/motorola/xpeng
      device_name:
        required: false
        type: string
        default: xpeng
      lunch_combo:
        required: true
        type: string
      build_target:
        required: false
        type: string
        default: boot
      java_version:
        required: true
        type: string
      artifact_basename:
        required: true
        type: string
      tag_prefix:
        required: true
        type: string
      version_label:
        description: Displayed TWRP version string (About screen / release notes)
        required: false
        type: string
        default: ''
      make_latest:
        required: false
        type: boolean
        default: false
      publish_release:
        required: false
        type: boolean
        default: true
      runner:
        required: false
        type: string
        default: ubuntu-24.04

jobs:
  build:
    name: Build ${{ inputs.manifest_branch }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      MANIFEST_URL: ${{ inputs.manifest_url }}
      MANIFEST_BRANCH: ${{ inputs.manifest_branch }}
      DEVICE_TREE_URL: ${{ inputs.device_tree_url }}
      DEVICE_TREE_REF: ${{ inputs.device_tree_ref }}
      DEVICE_PATH: ${{ inputs.device_path }}
      DEVICE_NAME: ${{ inputs.device_name }}
      LUNCH_COMBO: ${{ inputs.lunch_combo }}
      BUILD_TARGET: ${{ inputs.build_target }}
      ARTIFACT_BASENAME: ${{ inputs.artifact_basename }}
      TAG_PREFIX: ${{ inputs.tag_prefix }}
      VERSION_LABEL: ${{ inputs.version_label }}

    steps:
      - name: Maximize build space
        if: startsWith(inputs.runner, 'ubuntu-')
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 12288
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Check out build scripts
        uses: actions/checkout@v4

      - name: Show parameters
        run: |
          echo "Manifest: ${MANIFEST_URL} @ ${MANIFEST_BRANCH}"
          echo "Device tree: ${DEVICE_TREE_URL} @ ${DEVICE_TREE_REF}"
          echo "Device path: ${DEVICE_PATH}"
          echo "Lunch: ${LUNCH_COMBO}"
          echo "Target: ${BUILD_TARGET}image"
          echo "Java: ${{ inputs.java_version }}"
          df -h

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip unzip curl wget \
            zlib1g-dev libc6-dev-i386 lib32z1-dev lib32ncurses-dev \
            x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils \
            xsltproc python3 python-is-python3 gcc-multilib g++-multilib \
            libncurses-dev libssl-dev bc rsync schedtool pngcrush imagemagick \
            lzop liblz4-tool ccache tree libxml2 squashfs-tools \
            libgtk-3-dev libglu1-mesa-dev gperf cpio

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Install repo
        run: |
          mkdir -p "${HOME}/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "${HOME}/bin/repo"
          chmod a+x "${HOME}/bin/repo"
          sudo ln -sf "${HOME}/bin/repo" /usr/bin/repo
          git config --global user.name "LuoJuly"
          git config --global user.email "luojuly517@qq.com"
          git config --global color.ui false
          java -version
          repo version | head -5

      - name: Initialize repo
        id: init
        run: |
          mkdir -p workspace
          cd workspace
          echo "workspace=$(pwd)" >> "${GITHUB_OUTPUT}"
          repo init --depth=1 -u "${MANIFEST_URL}" -b "${MANIFEST_BRANCH}"

      - name: Sync source
        working-directory: workspace
        run: repo sync -j"$(nproc)" --force-sync --no-clone-bundle --current-branch --no-tags

      - name: Clone device tree
        working-directory: workspace
        run: |
          rm -rf "${DEVICE_PATH}"
          mkdir -p "$(dirname "${DEVICE_PATH}")"
          git clone --depth=1 -b "${DEVICE_TREE_REF}" "${DEVICE_TREE_URL}" "${DEVICE_PATH}"
          git -C "${DEVICE_PATH}" log -1 --oneline
          git -C "${DEVICE_PATH}" rev-parse HEAD > "${GITHUB_WORKSPACE}/device-tree.sha"
          if [[ ! -f "${DEVICE_PATH}/prebuilt/kernel" ]]; then
            echo "::error::${DEVICE_PATH}/prebuilt/kernel missing"
            exit 1
          fi
          ls -lh "${DEVICE_PATH}/prebuilt/kernel"

      - name: Sync device dependencies
        working-directory: workspace
        run: |
          dep=""
          for candidate in twrp.dependencies omni.dependencies; do
            if [[ -f "${DEVICE_PATH}/${candidate}" ]]; then
              dep="${DEVICE_PATH}/${candidate}"
              break
            fi
          done
          if [[ -z "${dep}" ]]; then
            echo "No twrp.dependencies / omni.dependencies — skip"
            exit 0
          fi
          echo "Converting ${dep}"
          bash "${GITHUB_WORKSPACE}/scripts/convert.sh" "${dep}"
          cat .repo/local_manifests/roomservice.xml
          repo sync -j"$(nproc)" --force-sync --no-clone-bundle --current-branch --no-tags

      - name: Apply device patches
        working-directory: workspace
        run: bash "${GITHUB_WORKSPACE}/scripts/apply-device-patches.sh" "$(pwd)" "${DEVICE_PATH}"

      - name: Build bootimage
        working-directory: workspace
        run: |
          set +u
          # shellcheck disable=SC1091
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          echo "==> lunch ${LUNCH_COMBO}"
          lunch "${LUNCH_COMBO}"
          make "${BUILD_TARGET}image" -j"$(nproc)"

      # Soong BOARD_RAMDISK_USE_LZ4 writes a modern lz4 frame. Motokernel
      # (xpeng 5.4) only unpacks the legacy frame (`lz4 -l`), same as local
      # `device/motorola/xpeng/scripts/repack-boot.sh` after mka bootimage.
      # 12.1 has no such script — leave the Soong image alone.
      - name: Repack bootimage (Motokernel legacy LZ4)
        working-directory: workspace
        run: |
          script="${DEVICE_PATH}/scripts/repack-boot.sh"
          if [[ -f "${script}" ]]; then
            echo "==> ${script}"
            export ANDROID_BUILD_TOP="$(pwd)"
            bash "${script}"
          else
            echo "==> No ${script}; keep Soong ${BUILD_TARGET}.img"
          fi

      - name: Collect artifact
        id: artifact
        run: |
          src="workspace/out/target/product/${DEVICE_NAME}/${BUILD_TARGET}.img"
          if [[ ! -f "${src}" ]]; then
            echo "::error::Missing ${src}"
            ls -la "workspace/out/target/product/${DEVICE_NAME}" || true
            exit 1
          fi
          mkdir -p artifacts
          out="artifacts/${ARTIFACT_BASENAME}.img"
          cp -v "${src}" "${out}"
          sha256sum "${out}" | tee artifacts/SHA256SUMS.txt
          ls -lh "${out}"
          echo "file=${out}" >> "${GITHUB_OUTPUT}"
          echo "sha256=$(cut -d' ' -f1 artifacts/SHA256SUMS.txt)" >> "${GITHUB_OUTPUT}"
          dt_sha="$(cat device-tree.sha)"
          echo "device_tree_sha=${dt_sha}" >> "${GITHUB_OUTPUT}"
          date_utc="$(date -u +%Y%m%d)"
          tag="${TAG_PREFIX}-${date_utc}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            tag="${tag}-r${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_basename }}
          path: |
            artifacts/${{ inputs.artifact_basename }}.img
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/${{ inputs.artifact_basename }}.img
          name: ${{ inputs.version_label != '' && format('TWRP {0} ({1})', inputs.version_label, steps.artifact.outputs.tag) || steps.artifact.outputs.tag }}
          tag_name: ${{ steps.artifact.outputs.tag }}
          make_latest: ${{ inputs.make_latest }}
          fail_on_unmatched_files: true
          body: |
            Motorola xpeng TWRP (`${{ inputs.build_target }}.img`, recovery-as-boot)

            | | |
            |---|---|
            | TWRP version | **${{ inputs.version_label != '' && inputs.version_label || inputs.tag_prefix }}** |
            | Manifest | `${{ inputs.manifest_url }}` @ `${{ inputs.manifest_branch }}` |
            | Device tree | `${{ inputs.device_tree_url }}` @ `${{ inputs.device_tree_ref }}` (`${{ steps.artifact.outputs.device_tree_sha }}`) |
            | Lunch | `${{ inputs.lunch_combo }}` |
            | Artifact | `${{ inputs.artifact_basename }}.img` |
            | SHA256 | `${{ steps.artifact.outputs.sha256 }}` |

            Flash with `fastboot boot` (one-shot) or `fastboot flash boot`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
