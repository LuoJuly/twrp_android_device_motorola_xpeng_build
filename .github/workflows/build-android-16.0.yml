name: Build TWRP 16.0 (xpeng)

on:
  workflow_dispatch:
    inputs:
      device_tree_ref:
        description: Device tree branch/tag (LuoJuly/twrp_android_device_motorola_xpeng)
        required: false
        default: android-16.0
      lunch_combo:
        description: Lunch combo (A16 needs product-release-variant)
        required: false
        default: twrp_xpeng-bp2a-eng
      publish_release:
        description: Create a GitHub Release and mark as Latest
        type: boolean
        default: true
      runner:
        description: Runner label (self-hosted required; ubuntu-24.04 OOMs on A16)
        required: false
        default: self-hosted

concurrency:
  group: twrp-16.0
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    uses: ./.github/workflows/reusable-build-twrp.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      manifest_url: https://github.com/TWRP-Test/platform_manifest_twrp_aosp
      manifest_branch: twrp-16.0
      device_tree_ref: ${{ inputs.device_tree_ref }}
      lunch_combo: ${{ inputs.lunch_combo }}
      java_version: '17'
      artifact_basename: boot_twrp_xpeng_lineage_3.7.1_a16.0
      tag_prefix: v3.7.1_16-0
      version_label: 3.7.1_16-0_lineage_by LuoJuly
      make_latest: true
      publish_release: ${{ inputs.publish_release }}
      runner: ${{ inputs.runner }}
